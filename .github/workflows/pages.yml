  name: Pages

  # 触发条件：推送到 main 分支时运行
  on:
    push:
      branches: [ main ]
    # 或手动触发：点击仓库的 Actions 标签页 → Run workflow

  # 权限设置
  permissions:
    contents: read        # 读取代码
    pages: write          # 写入 Pages
    id-token: write       # 验证身份

  # 防止并发运行
  concurrency:
    group: "pages"
    cancel-in-progress: false

  jobs:
    # 第一个任务：构建项目
    build:
      runs-on: windows-latest  # 在 Windows 环境构建（适合 Electron）
      steps:
        # 步骤 1: 检出代码
        - name: Checkout
          uses: actions/checkout@v4

        # 步骤 2: 设置 Node.js 环境
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'        # 使用 Node.js 20
            cache: 'npm'              # 缓存 npm 依赖，加快速度

        # 步骤 3: 安装依赖
        - name: Install dependencies
          run: npm install

        # 步骤 4: 构建项目
        - name: Build for Electron
          run: npm run build

        # 步骤 5: 上传构建结果
        - name: Upload artifact
          uses: actions/upload-pages-artifact@v3
          with:
            path: 'dist'              # 构建输出目录

    # 第二个任务：部署到 Pages
    deploy:
      # 设置 Pages 环境
      environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}
      runs-on: ubuntu-latest
      needs: build                  # 等待 build 任务完成
      steps:
        # 步骤 6: 部署到 Pages
        - name: Deploy to GitHub Pages
          id: deployment
          uses: actions/deploy-pages@v4
